; Limiti di upload solo per questo sito (letto da PHP-FPM, non servito da nginx).
; Certificato medico fino a 5 MB per partecipante, foto del blog fino a 8 MB;
; un ordine con più partecipanti invia più certificati in una sola richiesta.
upload_max_filesize = 8M
post_max_size = 64M
max_file_uploads = 20
